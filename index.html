<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>LOIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  background:#f6f7fb;
  color:#17191f;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  height:100%;
  max-width:700px;
  margin:auto;
  background:#fff;
  position:relative;
  overflow:hidden;
}

.screen{
  display:none;
  position:absolute;
  inset:0;
  padding-bottom:76px;
  overflow-y:auto;
  background:#f7f8fb;
}

.screen.active{
  display:block;
}

.header{
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
}

.header-title{
  font-size:19px;
  font-weight:700;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#f0f1f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.container{
  padding:16px;
}

.search{
  width:100%;
  padding:13px 16px;
  border:0;
  outline:0;
  border-radius:14px;
  background:#eef0f4;
  margin-bottom:15px;
}

.section-title{
  font-size:14px;
  font-weight:700;
  color:#777d89;
  margin:20px 4px 8px;
}

.card{
  background:#fff;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 1px 4px #00000008;
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  background:#fff;
  border-bottom:1px solid #f0f0f2;
}

.row:last-child{
  border-bottom:0;
}

.row:active{
  background:#f5f6f8;
}

.avatar{
  width:50px;
  height:50px;
  flex:none;
  border-radius:50%;
  background:#e9ebf1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sub{
  margin-top:4px;
  color:#858a95;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.badge{
  background:#111;
  color:#fff;
  min-width:21px;
  height:21px;
  padding:0 6px;
  border-radius:99px;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.action{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#17191f;
  color:#fff;
  font-weight:700;
  margin-bottom:12px;
}

.action.secondary{
  background:#eef0f4;
  color:#17191f;
}

.empty{
  padding:35px 15px;
  text-align:center;
  color:#888d98;
}

.bottom-nav{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  flex:1;
  background:none;
  color:#888d98;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
}

.nav-btn span:first-child{
  font-size:22px;
}

.nav-btn.active{
  color:#17191f;
  font-weight:700;
}

/* HOME */

.hero{
  padding:22px 18px 10px;
  background:#fff;
}

.hero h1{
  margin:0;
  font-size:25px;
}

.hero p{
  color:#858a95;
  margin:7px 0 0;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
  margin-top:18px;
}

.quick button{
  background:#f1f2f6;
  border-radius:14px;
  padding:13px 4px;
  font-size:12px;
}

.quick div{
  font-size:23px;
  margin-bottom:4px;
}

/* CHAT */

.chat-screen{
  position:absolute;
  inset:0;
  background:#f7f8fb;
  z-index:200;
  display:none;
  flex-direction:column;
  padding-bottom:0;
}

.chat-screen.active{
  display:flex;
}

.chat-header{
  height:64px;
  flex:none;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
}

.chat-header .avatar{
  width:40px;
  height:40px;
  font-size:19px;
}

.chat-header-info{
  flex:1;
  min-width:0;
}

.chat-header-name{
  font-weight:700;
}

.chat-header-status{
  font-size:11px;
  color:#858a95;
  margin-top:2px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px 12px 10px;
}

.message-row{
  display:flex;
  margin:7px 0;
}

.message-row.me{
  justify-content:flex-end;
}

.bubble{
  max-width:min(75vw,420px);
  padding:10px 13px;
  border-radius:17px;
  background:#fff;
  box-shadow:0 1px 3px #0000000c;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.message-row.me .bubble{
  background:#17191f;
  color:#fff;
  border-bottom-right-radius:5px;
}

.message-meta{
  font-size:10px;
  color:#9095a0;
  margin-top:3px;
}

.message-row.me .message-meta{
  text-align:right;
}

.chat-input-area{
  flex:none;
  min-height:66px;
  padding:9px;
  background:#fff;
  border-top:1px solid #eee;
  display:flex;
  gap:7px;
  align-items:center;
}

.chat-input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:#f0f1f5;
  border-radius:22px;
  padding:11px 15px;
}

.send-btn{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#17191f;
  color:#fff;
  font-size:18px;
}

/* MODAL */

.modal{
  display:none;
  position:absolute;
  inset:0;
  background:#0007;
  z-index:500;
  align-items:flex-end;
  justify-content:center;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:85%;
  overflow-y:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:20px;
}

.modal-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:18px;
}

.modal-input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  margin-bottom:10px;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:12px;
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:12px;
  background:#17191f;
  color:#fff;
}

.modal-actions .cancel{
  background:#eef0f4;
  color:#17191f;
}

/* PROFILE */

.profile-card{
  background:#fff;
  border-radius:18px;
  padding:25px 15px;
  text-align:center;
}

.profile-big-avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  background:#e9ebf1;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:38px;
  overflow:hidden;
}

.profile-big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:21px;
  font-weight:800;
  margin-top:12px;
}

.profile-id{
  color:#888d98;
  font-size:13px;
  margin-top:4px;
}

.setting-row{
  padding:16px;
  display:flex;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid #eee;
}

.setting-row:first-child{
  border-radius:15px 15px 0 0;
}

.setting-row:last-child{
  border-radius:0 0 15px 15px;
  border-bottom:0;
}

/* NOTIFICATION */

.notification{
  padding:14px;
  background:#fff;
  border-bottom:1px solid #eee;
}

.notification-title{
  font-weight:700;
}

.notification-sub{
  font-size:12px;
  color:#888d98;
  margin-top:4px;
}

/* AUTH */

.auth{
  position:absolute;
  inset:0;
  z-index:1000;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.auth.hidden{
  display:none;
}

.auth-box{
  width:100%;
  max-width:400px;
}

.auth-logo{
  font-size:45px;
  font-weight:900;
  letter-spacing:-3px;
  text-align:center;
  margin-bottom:8px;
}

.auth-sub{
  text-align:center;
  color:#888d98;
  margin-bottom:28px;
}

.auth input{
  width:100%;
  border:1px solid #ddd;
  border-radius:13px;
  padding:14px;
  margin-bottom:10px;
  outline:none;
}

.auth button{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:#17191f;
  color:#fff;
  font-weight:700;
  margin-top:4px;
}

.auth-switch{
  background:none!important;
  color:#555!important;
  margin-top:10px!important;
}

.error{
  color:#d33;
  font-size:13px;
  min-height:20px;
  margin:5px 0;
}
</style>
</head>

<body>

<div class="app">

<!-- ================= AUTH ================= -->

<div id="authScreen" class="auth">

  <div class="auth-box">

    <div class="auth-logo">LOIN</div>

    <div class="auth-sub">
      自分たちのSNSをつくろう。
    </div>

    <div id="authTitle"
         style="font-size:22px;font-weight:800;margin-bottom:15px;text-align:center;">
      ログイン
    </div>

    <input id="authEmail"
           type="email"
           placeholder="メールアドレス">

    <input id="authPassword"
           type="password"
           placeholder="パスワード">

    <input id="authUsername"
           style="display:none"
           placeholder="LOIN ID">

    <input id="authDisplayName"
           style="display:none"
           placeholder="表示名">

    <div id="authError" class="error"></div>

    <button onclick="submitAuth()">
      <span id="authSubmitText">ログイン</span>
    </button>

    <button class="auth-switch"
            onclick="toggleAuthMode()">
      アカウントを作成する
    </button>

  </div>

</div>


<!-- ================= HOME ================= -->

<section id="home" class="screen active">

  <div class="hero">

    <div style="display:flex;justify-content:space-between;align-items:center;">

      <div>
        <h1 id="homeGreeting">こんにちは！</h1>
        <p>LOINへようこそ。</p>
      </div>

      <button class="icon-btn"
              onclick="showNotifications()">
        🔔
      </button>

    </div>

    <div class="quick">

      <button onclick="switchScreen('talk')">
        <div>💬</div>
        トーク
      </button>

      <button onclick="switchScreen('friends')">
        <div>👥</div>
        友だち
      </button>

      <button onclick="switchScreen('groups');loadGroups()">
        <div>👨‍👩‍👧</div>
        グループ
      </button>

      <button onclick="showNotifications()">
        <div>🔔</div>
        通知
      </button>

    </div>

  </div>

  <div class="container">

    <div class="section-title">
      最近のトーク
    </div>

    <div id="homeChats" class="card">
      <div class="empty">
        まだトークがありません
      </div>
    </div>

    <div class="section-title">
      オンラインの友だち
    </div>

    <div id="onlineFriends" class="card">
      <div class="empty">
        読み込み中…
      </div>
    </div>

  </div>

</section>


<!-- ================= TALK ================= -->

<section id="talk" class="screen">

  <header class="header">
    <div class="logo">トーク</div>

    <button class="icon-btn"
            onclick="newChat()">
      ＋
    </button>
  </header>

  <div class="container">

    <input class="search"
           id="chatSearch"
           placeholder="トークを検索"
           oninput="filterChats()">

    <div class="section-title">
      トーク
    </div>

    <div id="chatList" class="card">

      <div class="empty">
        まだトークがありません
      </div>

    </div>

  </div>

</section>


<!-- ================= FRIENDS ================= -->

<section id="friends" class="screen">

  <header class="header">

    <div class="logo">友だち</div>

    <button class="icon-btn"
            onclick="addFriend()">
      ＋
    </button>

  </header>

  <div class="container">

    <input
      id="friendSearch"
      class="search"
      placeholder="LOIN ID・名前で検索"
      oninput="searchFriends()"
    >

    <button class="action"
            onclick="addFriend()">
      ＋ 友だちを追加
    </button>

    <div class="section-title">
      友だち
    </div>

    <div id="friendList" class="card">
      <div class="empty">
        読み込み中…
      </div>
    </div>

    <div class="section-title">
      友だち申請
    </div>

    <div id="friendRequests" class="card">
      <div class="empty">
        読み込み中…
      </div>
    </div>

  </div>

</section>


<!-- ================= GROUPS ================= -->

<section id="groups" class="screen">

  <header class="header">

    <div class="logo">グループ</div>

    <button class="icon-btn"
            onclick="createGroup()">
      ＋
    </button>

  </header>

  <div class="container">

    <button class="action"
            onclick="createGroup()">
      ➕ 新しいグループを作成
    </button>

    <div class="section-title">
      参加中のグループ
    </div>

    <div id="groupList" class="card">
      <div class="empty">
        読み込み中…
      </div>
    </div>

  </div>

</section>


<!-- ================= PROFILE ================= -->

<section id="me" class="screen">

  <header class="header">
    <div class="logo">Me</div>
  </header>

  <div class="container">

    <div class="profile-card">

      <div id="profileAvatar"
           class="profile-big-avatar">
        👤
      </div>

      <div id="profileName"
           class="profile-name">
        LOINユーザー
      </div>

      <div id="profileId"
           class="profile-id">
        @loin
      </div>

      <button class="action"
              style="margin-top:18px;margin-bottom:0"
              onclick="editProfile()">
        プロフィールを編集
      </button>

    </div>

    <div class="section-title">
      設定
    </div>

    <div class="card">

      <div class="setting-row"
           onclick="alert('通知設定は次のアップデートで追加予定です。')">
        <span>🔔 通知</span>
        <span>›</span>
      </div>

      <div class="setting-row"
           onclick="alert('プライバシー設定は次のアップデートで追加予定です。')">
        <span>🔒 プライバシー</span>
        <span>›</span>
      </div>

      <div class="setting-row"
           onclick="alert('デザイン設定は次のアップデートで追加予定です。')">
        <span>🎨 デザイン</span>
        <span>›</span>
      </div>

      <div class="setting-row"
           onclick="logout()">
        <span>🚪 ログアウト</span>
        <span>›</span>
      </div>

    </div>

  </div>

</section>


<!-- ================= CHAT ================= -->

<section id="chatScreen"
         class="chat-screen">

  <header class="chat-header">

    <button class="icon-btn"
            onclick="closeChat()">
      ←
    </button>

    <div id="chatAvatar"
         class="avatar">
      👤
    </div>

    <div class="chat-header-info">

      <div id="chatTitle"
           class="chat-header-name">
        トーク
      </div>

      <div id="chatStatus"
           class="chat-header-status">
        オフライン
      </div>

    </div>

    <button class="icon-btn"
            onclick="startVoiceCall()">
      📞
    </button>

    <button class="icon-btn"
            onclick="startVideoCall()">
      📹
    </button>

  </header>

  <div id="messages"
       class="messages">
  </div>

  <div class="chat-input-area">

    <button class="icon-btn"
            onclick="openChatActions()">
      ＋
    </button>

    <input id="chatInput"
           class="chat-input"
           placeholder="メッセージ"
           onkeydown="handleInput(event)">

    <button class="send-btn"
            onclick="sendMessage()">
      ➤
    </button>

  </div>

</section>


<!-- ================= GROUP CHAT ================= -->

<section id="groupChatScreen"
         class="chat-screen">

  <header class="chat-header">

    <button class="icon-btn"
            onclick="closeGroupChat()">
      ←
    </button>

    <div class="avatar">
      👥
    </div>

    <div class="chat-header-info">

      <div id="groupChatTitle"
           class="chat-header-name">
        グループ
      </div>

      <div id="groupChatMembers"
           class="chat-header-status">
        0人
      </div>

    </div>

    <button class="icon-btn"
            onclick="groupMembers()">
      👥
    </button>

  </header>

  <div id="groupMessages"
       class="messages">
  </div>

  <div class="chat-input-area">

    <button class="icon-btn"
            onclick="openChatActions()">
      ＋
    </button>

    <input id="groupChatInput"
           class="chat-input"
           placeholder="メッセージ"
           onkeydown="handleGroupInput(event)">

    <button class="send-btn"
            onclick="sendGroupMessage()">
      ➤
    </button>

  </div>

</section>


<!-- ================= NOTIFICATION MODAL ================= -->

<div id="notificationModal"
     class="modal"
     onclick="closeModal(event,'notificationModal')">

  <div class="modal-box"
       onclick="event.stopPropagation()">

    <div class="modal-title">
      通知
    </div>

    <div id="notificationList"
         class="card">
      <div class="empty">
        通知はありません
      </div>
    </div>

    <div class="modal-actions">
      <button class="cancel"
              onclick="hideModal('notificationModal')">
        閉じる
      </button>
    </div>

  </div>

</div>


<!-- ================= ADD FRIEND MODAL ================= -->

<div id="friendModal"
     class="modal"
     onclick="closeModal(event,'friendModal')">

  <div class="modal-box"
       onclick="event.stopPropagation()">

    <div class="modal-title">
      友だちを追加
    </div>

    <input id="friendIdInput"
           class="modal-input"
           placeholder="LOIN ID">

    <div id="friendResult"></div>

    <div class="modal-actions">

      <button class="cancel"
              onclick="hideModal('friendModal')">
        キャンセル
      </button>

      <button onclick="sendFriendRequest()">
        申請する
      </button>

    </div>

  </div>

</div>


<!-- ================= CREATE GROUP MODAL ================= -->

<div id="groupModal"
     class="modal"
     onclick="closeModal(event,'groupModal')">

  <div class="modal-box"
       onclick="event.stopPropagation()">

    <div class="modal-title">
      新しいグループ
    </div>

    <input id="groupNameInput"
           class="modal-input"
           placeholder="グループ名">

    <div class="modal-actions">

      <button class="cancel"
              onclick="hideModal('groupModal')">
        キャンセル
      </button>

      <button onclick="submitCreateGroup()">
        作成
      </button>

    </div>

  </div>

</div>


<!-- ================= EDIT PROFILE MODAL ================= -->

<div id="profileModal"
     class="modal"
     onclick="closeModal(event,'profileModal')">

  <div class="modal-box"
       onclick="event.stopPropagation()">

    <div class="modal-title">
      プロフィール編集
    </div>

    <input id="editDisplayName"
           class="modal-input"
           placeholder="表示名">

    <input id="editStatus"
           class="modal-input"
           placeholder="ステータス">

    <div class="modal-actions">

      <button class="cancel"
              onclick="hideModal('profileModal')">
        キャンセル
      </button>

      <button onclick="saveProfile()">
        保存
      </button>

    </div>

  </div>

</div>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button class="nav-btn active"
          onclick="switchScreen('home',this)">
    <span>🏠</span>
    <span>ホーム</span>
  </button>

  <button class="nav-btn"
          onclick="switchScreen('talk',this);loadChats()">
    <span>💬</span>
    <span>トーク</span>
  </button>

  <button class="nav-btn"
          onclick="switchScreen('friends',this);loadFriends()">
    <span>👥</span>
    <span>友だち</span>
  </button>

  <button class="nav-btn"
          onclick="switchScreen('groups',this);loadGroups()">
    <span>👨‍👩‍👧</span>
    <span>グループ</span>
  </button>

  <button class="nav-btn"
          onclick="switchScreen('me',this);loadProfile()">
    <span>👤</span>
    <span>Me</span>

function toggleAuthMode(){

  document.getElementById("authTitle")

async function submitAuth(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  const errorBox =
    document.getElementById("authError");

  errorBox.textContent = "";


  if(!email || !password){

    errorBox.textContent =
      "メールアドレスとパスワードを入力してください。";

    return;
  }


  if(authMode === "login"){

    const {
      error
    } =
      await db.auth.signInWithPassword({
        email,
        password
      });


    if(error){

      errorBox.textContent =
        error.message;

      return;
    }

  }else{

    const username =
      document.getElementById("authUsername")
        .value.trim();

    const displayName =
      document.getElementById("authDisplayName")
        .value.trim();


    if(!username || !displayName){

      errorBox.textContent =
        "LOIN IDと表示名を入力してください。";

      return;
    }


    const {
      data,
      error
    } =
      await db.auth.signUp({

        email,

        password,

        options:{
          data:{
            username,
            display_name:displayName
          }
        }

      });


    if(error){

      errorBox.textContent =
        error.message;

      return;
    }


    if(data.user){

      /*
       メール確認がOFFならそのままプロフィール作成
      */

      if(data.session){

        await createProfile(
          data.user,
          username,
          displayName
        );

      }

    }

  }

}

function subscribeFriendships(){

async function openChat(profile){

    profile;

    "chatTitle"

async function loadMessages(){

  if(!currentUser || !currentChatUser)
    return;


  const {
    data,
    error
  } =
    await db
      .from("messages")
      .select("*")
      .or(
        `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(error){

    console.error(error);

    return;

  }


  const box =
    document.getElementById(
      "messages"
    );

  box.innerHTML = "";


  data.forEach(
    renderMessage
  );


  scrollMessages();

}


function renderMessage(message){

  const box =
    document.getElementById(
      "messages"
    );


  if(
    box.querySelector(
      `[data-message-id="${message.id}"]`
    )
  )
    return;


  const row =
    document.createElement("div");


  row.dataset.messageId =
    message.id;


  row.className =
    "message-row " +
    (
      message.sender_id === currentUser.id
        ? "me"
        : ""
    );


  const time =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  row.innerHTML = `

    <div>

      <div class="bubble">
        ${escapeHtml(message.content)}
      </div>

      <div class="message-meta">
        ${time}
        ${message.sender_id === currentUser.id
          ? "　送信済み"
          : ""}
      </div>

    </div>

  `;


  box.appendChild(row);

}


async function sendMessage(){

  const input =
    document.getElementById(
      "chatInput"
    );


  const content =
    input.value.trim();


  if(!content ||
     !currentUser ||
     !currentChatUser)
    return;


  const {
    data,
    error
  } =
    await db
      .from("messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          currentChatUser.id,

        content

      })
      .select()
      .single();


  if(error){

    alert(error.message);

    return;

  }


  input.value = "";

  renderMessage(data);

  scrollMessages();

}


function subscribeMessages(){

  if(messageChannel)
    db.removeChannel(
      messageChannel
    );


  if(!currentChatUser)
    return;


  messageChannel =
    db

      .channel(
        "messages-" +
        currentUser.id +
        "-" +
        currentChatUser.id
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages"
        },
        payload=>{

          const message =
            payload.new;


          if(
            (
              message.sender_id === currentUser.id &&
              message.receiver_id === currentChatUser.id
            )
            ||
            (
              message.sender_id === currentChatUser.id &&
              message.receiver_id === currentUser.id
            )
          ){

            renderMessage(message);

            scrollMessages();

          }

        }
      )

      .subscribe();

}


function handleInput(event){

  if(event.key === "Enter"){

    event.preventDefault();

    sendMessage();

  }

}


function scrollMessages(){

  const box =
    document.getElementById(
      "messages"
    );

  if(box)
    box.scrollTop =
      box.scrollHeight;

}


async function loadChats(){

    data,
    error

      .from("messages")

  }


  if(!data.length){

      </div>`;

  const ids = [];

    const id =
      m.sender_id === currentUser.id

    if(!ids.includes(id))

  const {
    data:profiles
  } =

    const last =

      );

    row.className = "row";

        👤
      </div>

      <div class="info">

        <div class="name">
          ${escapeHtml(profile.display_name)}

        <div class="sub">

  });

function renderGroupMessage(message){

    document.getElementById(
      "groupMessages"
    );


  if(
    box.querySelector(
      `[data-group-message-id="${message.id}"]`
    )
  )
    return;


  const row =
    document.createElement("div");


  row.dataset.groupMessageId =
    message.id;


  row.className =
    "message-row " +
    (
      message.sender_id === currentUser.id
        ? "me"
        : ""
    );


  const time =
    new Date(
      message.created_at
    ).toLocaleTimeString(
      "ja-JP",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  row.innerHTML = `

    <div>

      <div class="bubble">
        ${escapeHtml(message.content)}
      </div>

      <div class="message-meta">
        ${time}
        ${message.sender_id === currentUser.id
          ? "　送信済み"
          : ""}
      </div>

    </div>

  `;


  box.appendChild(row);

}


async function sendGroupMessage(){

  const input =
    document.getElementById(
      "groupChatInput"
    );


  const content =
    input.value.trim();


  if(
    !content ||
    !currentGroupId ||
    !currentUser
  )
    return;


  const {
    data,
    error
  } =
    await db
      .from("group_messages")
      .insert({

        group_id:
          currentGroupId,

        sender_id:
          currentUser.id,

        content

      })
      .select()
      .single();


  if(error){

    alert(
      "送信できませんでした。\n\n" +
      error.message
    );

    return;

  }


  input.value = "";

  renderGroupMessage(data);

  const box =
    document.getElementById(
      "groupMessages"
    );

  box.scrollTop =
    box.scrollHeight;

}


function handleGroupInput(event){

  if(event.key === "Enter"){

    event.preventDefault();

    sendGroupMessage();

  }

}


function subscribeGroupMessages(){

  if(groupMessageChannel){

    db.removeChannel(
      groupMessageChannel
    );

  }


  if(!currentGroupId)
    return;


  groupMessageChannel =
    db

      .channel(
        "group-messages-" +
        currentGroupId
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"group_messages",
          filter:
            `group_id=eq.${currentGroupId}`
        },
        payload=>{

          renderGroupMessage(
            payload.new
          );


          const box =
            document.getElementById(
              "groupMessages"
            );

          box.scrollTop =
            box.scrollHeight;

        }
      )

      .subscribe();

}


async function groupMembers(){

  if(!currentGroupId)
    return;


  const {
    data,
    error
  } =
    await db
      .from("group_members")
      .select("*")
      .eq(
        "group_id",
        currentGroupId
      );


  if(error){

    alert(error.message);

    return;

  }


  alert(
    `「${currentGroupName}」\n\n` +
    `${data.length}人が参加しています。`
  );

}

/* =========================================================
   MODAL
========================================================= */

function showModal(id){

  document
    .getElementById(id)
    .classList.add("active");

}


function hideModal(id){

  document
    .getElementById(id)
    .classList.remove("active");

}


function closeModal(event,id){

  if(event.target === event.currentTarget)
    hideModal(id);

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}
